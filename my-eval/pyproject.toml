[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-eval"
version = "0.1.0"
description = "Harbor evaluation adapter and test runner for my-agent-harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "harbor>=0.24.0",
]

[project.scripts]
my-eval = "my_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/my_eval"]
