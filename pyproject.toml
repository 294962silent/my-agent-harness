[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-pi-agent"
version = "0.2.0"
description = "Long-horizon coding-agent harness with local memory, observable execution and controlled strategy optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.50.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "Pillow>=10",
    "httpx>=0.27.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0",
    "mcp>=2.0.0,<2.1",
    "filelock>=3.32.6",
    "pytest>=9.1.1",
]

[project.scripts]
my-pi-agent = "my_coding_agent.cli:main"
my-agent-dream = "my_coding_agent.dream_rsi_replay:main"

[project.optional-dependencies]
mem0 = [
    "mem0ai @ git+https://github.com/mem0ai/mem0.git@f1791daa86d469249c9b002f62644d58a1eb96a0",
]
mem0-local = [
    "mem0ai @ git+https://github.com/mem0ai/mem0.git@f1791daa86d469249c9b002f62644d58a1eb96a0",
    "fastembed==0.9.1",
]
langfuse = ["langfuse==5.2.0"]
dream-rsi = [
    "dream-rsi @ git+https://github.com/google-research/dream-rsi.git@8ec35bd2538220517ce1bfca4282db21b8c518db",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "anyio>=4.0",
    "ruff>=0.16.7",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/my_agent_llm",
    "src/my_agent_core",
    "src/my_coding_agent",
]

[tool.hatch.build.targets.wheel.force-include]
# TUI assets are gitignored (my-tui/dist), so `npm run build` must run before `uv build`.
"my-tui/bin" = "my_coding_agent/my-tui/bin"
"my-tui/dist" = "my_coding_agent/my-tui/dist"
"my-tui/package.json" = "my_coding_agent/my-tui/package.json"

[tool.pytest.ini_options]
pythonpath = ["src", "my-eval/src", "."]
testpaths = ["tests"]
addopts = "-ra -q --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 120
# 官方判分脚本原样保留，不做风格改造
extend-exclude = ["experiments/longmemeval/official_evaluate_qa.py"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pyright]
extraPaths = ["src", "my-eval/src", "."]
