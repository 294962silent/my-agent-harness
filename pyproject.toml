[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-pi-agent"
version = "0.2.0"
description = "Minimalist Pi-style coding-agent framework and CLI with Pi-TUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.50.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0",
    "mcp>=2.0.0,<2.1",
    "filelock>=3.32.6",
]

[project.scripts]
my-pi-agent = "my_coding_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "anyio>=4.0",
    "ruff>=0.16.7",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/my_agent_llm",
    "src/my_agent_core",
    "src/my_coding_agent",
]

[tool.hatch.build.targets.wheel.force-include]
# TUI assets are gitignored (my-pi-tui/dist), so `npm run build` must run before `uv build`.
"my-pi-tui/bin" = "my_coding_agent/my-pi-tui/bin"
"my-pi-tui/dist" = "my_coding_agent/my-pi-tui/dist"
"my-pi-tui/package.json" = "my_coding_agent/my-pi-tui/package.json"

[tool.pytest.ini_options]
pythonpath = ["src", "my-pi-eval/src", "."]
testpaths = ["tests"]
addopts = "-ra -q --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 120
# 官方判分脚本原样保留，不做风格改造
extend-exclude = ["experiments/longmemeval/official_evaluate_qa.py"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pyright]
extraPaths = ["src", "my-pi-eval/src", "."]
